name: Benchmark
on:
  pull_request:
    branches:
      - main
      - master

permissions:
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run benchmarks
        uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          tune: 'false'
          # The pull request's own script, run on both revisions, with the packages it
          # loads besides Regress and BenchmarkTools (which AirspeedVelocity adds).
          # benchmark/run_asv.jl uses the same list.
          script: benchmark/benchmarks.jl
          extra-pkgs: CovarianceMatrices,DataFrames,StableRNGs
