name: Benchmark
on:
  pull_request:
    branches:
      - main
      - master

permissions:
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run benchmarks
        uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          tune: 'false'
          # The pull request's own script, run on both revisions. Passing it explicitly
          # also keeps benchmark/Project.toml (CUDA, MKL, RCall, ... for the other
          # scripts in benchmark/) out of the environment.
          script: benchmark/benchmarks.jl
          extra-pkgs: BenchmarkTools,CovarianceMatrices,DataFrames,StableRNGs
